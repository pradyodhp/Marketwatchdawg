[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "marketwatch"
version = "0.1.0"
description = "Explainable Real-Time Market Surveillance & Behavioral Anomaly Detection"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0.1",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pyarrow>=15.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
]
api = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "httpx>=0.27.0",
]
dashboard = [
    "streamlit>=1.35.0",
    "plotly>=5.20.0",
]
ingestion = [
    "yfinance>=0.2.40",
]

[tool.hatch.build.targets.wheel]
packages = ["src/marketwatch"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"
