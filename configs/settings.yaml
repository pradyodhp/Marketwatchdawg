# MarketWatch AI settings (edit here or via PUT /settings)
data_dir: data
curated_dir: data/curated
metadata_file: data/curated/quality_metadata.json
universe_config_path: configs/universe_nifty100.json
market:
  timezone: Asia/Kolkata
  slots_per_day: 75
  bar_interval_minutes: 5
risk_scoring:
  # Detector fusion weights, keyed by detector name.
  weights:
    ZScoreDetector: 0.35
    EWMADetector: 0.25
    IsolationForestDetector: 0.40
  thresholds:
    low: 0.0
    medium: 50.0
    high: 70.0
    critical: 85.0
detectors:
  # Rolling/time-of-day Z-score: anomaly when |z| >= zscore_threshold, with at
  # least min_observations prior same-slot observations.
  zscore_threshold: 3.0
  min_observations: 3
  # EWMA: mean update weight (higher = reacts faster) and anomaly threshold.
  ewma_alpha: 0.3
  ewma_threshold: 2.5
  # Walk-forward Isolation Forest refit cadence: retrain on strictly-prior
  # history every N batches (1 = every batch, strictest and slowest; 8 keeps
  # an interactive full-history detection run responsive).
  isolation_forest_refit_interval: 8
cooldown:
  # Alert cooldown in bars (6 x 5-minute bars = 30 minutes per symbol).
  window_bars: 6
notifications:
  # Optional HTTPS webhook for HIGH/CRITICAL alert delivery (Slack, Teams,
  # Telegram, automation tools). Empty disables delivery.
  # Can also be set via MARKETWATCH_NOTIFICATIONS__WEBHOOK_URL.
  webhook_url: ""
  min_severity: HIGH
replay:
  default_speed: 1.0
  auto_play: false
logging:
  level: INFO
